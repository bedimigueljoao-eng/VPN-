name: Build & Publish Internet Vault APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK Android (Internet Vault)
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=AO"
          fi

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Executar testes unitários JVM
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest --no-daemon

      - name: Compilar APK (Debug assinado)
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar ficheiro Internet-Vault-Android.apk
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/Internet-Vault-Android.apk
          ls -lh release-apk/Internet-Vault-Android.apk

      - name: Disponibilizar APK nos Artifacts do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Internet-Vault-Android-APK
          path: release-apk/Internet-Vault-Android.apk
          retention-days: 30

      - name: Publicar APK na secção Releases do GitHub
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-apk' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Internet Vault {0}', github.ref_name) || 'Internet Vault · Última Versão Android (APK)' }}
          body: |
            Aplicação Android **Internet Vault** compilada automaticamente via GitHub Actions.

            ### Como instalar no telemóvel Android:
            1. Transfira o ficheiro **`Internet-Vault-Android.apk`** abaixo.
            2. Abra o ficheiro no gestor de ficheiros do seu telemóvel.
            3. Se solicitado, permita a instalação a partir dessa fonte (*Instalar aplicações desconhecidas*).
            4. Abra o **Internet Vault**, conceda a permissão de notificações e autorize a ligação VPN quando tocar em **LIGAR**.
          files: release-apk/Internet-Vault-Android.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
